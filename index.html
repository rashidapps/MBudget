<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ميزانيتي</title>
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--ink:#12201d;--muted:#6b7a76;--line:#e3e9e7;
  --brand:#0f766e;--brand-ink:#fff;--brand-soft:#d9efec;
  --ok:#15803d;--bad:#dc2626;--warn:#d97706;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1514;--card:#16211f;--ink:#e8f1ef;--muted:#8fa19d;--line:#243330;
  --brand:#2dd4bf;--brand-ink:#04211d;--brand-soft:#16312e;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top);overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.m{unicode-bidi:isolate;white-space:nowrap}
.cur{font-size:.72em;color:var(--muted);margin-inline-start:3px}
.hidden{display:none!important}

/* header */
#hd{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 12px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#hd .t{text-align:center;flex:1}
#hd .t b{display:block;font-size:1.1rem}
#hd .t small{opacity:.85;font-size:.78rem}
#hd .nv{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);font-size:1.5rem;line-height:1;color:inherit}
#hd .nv:disabled{opacity:.3}
#main{padding:12px 12px 170px;max-width:640px;margin:0 auto}

/* tab bar */
#tb{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tb button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:.72rem}
#tb button span{font-size:1.35rem;line-height:1.1}
#tb button.on{color:var(--brand);font-weight:700}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:1.05rem;padding:14px 26px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28)}

/* cards */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;font-size:.8rem}
.hero{background:linear-gradient(135deg,var(--brand),#0b5a54);color:#fff;text-align:center;padding:18px 14px}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#115e57,#0c3f3b)}}
.hero .lb{opacity:.85;font-size:.85rem}
.hero .big{font-size:2.6rem;font-weight:800;line-height:1.15;margin:2px 0}
.hero .big.neg{color:#fecaca}
.hero .sub{opacity:.9;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 4px;font-size:.72rem}
.stats b{display:block;font-size:1rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none;color:var(--brand-ink)}
.chk.on{background:var(--brand);border-color:var(--brand)}
.rn{flex:1;min-width:0}
.rn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn small{color:var(--muted);font-size:.75rem}
.ra{font-weight:700}
.row.done .rn span{color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* variable cards */
.vc{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.vc:first-of-type{border-top:0}
.vc .bd{flex:1;min-width:0}
.vc .top{display:flex;justify-content:space-between;gap:6px;margin-bottom:6px;align-items:baseline}
.vc .nm{font-weight:600}
.vc .left{font-weight:800;font-size:1.1rem}
.vc .of{color:var(--muted);font-size:.75rem;margin-top:4px;display:flex;justify-content:space-between}
.plus{width:46px;height:46px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:1.8rem;line-height:1;flex:none;font-weight:700}
.ed{color:var(--muted);font-size:.9rem;padding:4px 6px}

/* buttons / forms */
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;border-radius:99px;font-size:.85rem}
.btns{display:grid;gap:8px;margin-top:10px}
.field{display:block;margin:10px 0 0}
.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem}
.bigin{width:100%;text-align:center;font-size:2.4rem;font-weight:800;padding:10px;border:2px solid var(--brand);border-radius:16px;background:var(--bg);direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{padding:9px 13px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.chk-line{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk-line input{width:22px;height:22px;accent-color:var(--brand)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}
.warnbox{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px;font-size:.85rem;margin-top:10px}
@media (prefers-color-scheme:dark){.warnbox{background:#3a2e0b;color:#fde68a}}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(30px);transition:transform .2s}
.ov.show .sheet{transform:none}
.grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:2px auto 10px}
.sheet h3{margin:0 0 6px;text-align:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(138px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:.9rem;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
#offline{background:var(--warn);color:#fff;text-align:center;font-size:.8rem;padding:4px}

/* auth */
#auth{max-width:420px;margin:0 auto;padding:60px 20px}
#auth h1{text-align:center;color:var(--brand);margin:0 0 4px}
#auth p{text-align:center;color:var(--muted);margin:0 0 20px}

/* report */
.rep table{width:100%;border-collapse:collapse;font-size:.88rem}
.rep th,.rep td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start}
.rep th{color:var(--muted);font-weight:600;font-size:.78rem}
.rep td:last-child,.rep th:last-child{text-align:end}
.rep tfoot td{font-weight:800;border-bottom:0}
.logday{color:var(--muted);font-size:.8rem;margin:10px 4px 4px}
</style>
</head>
<body>
<div id="offline" class="hidden">لا يوجد اتصال بالإنترنت — التسجيل يحتاج اتصالاً</div>
<div id="auth" class="hidden"></div>
<header id="hd" class="hidden"></header>
<main id="main" class="hidden"></main>
<button id="fab" class="hidden" data-act="addExpense">＋ مصروف</button>
<nav id="tb" class="hidden">
  <button data-act="tab" data-id="home"><span>🏠</span>الرئيسية</button>
  <button data-act="tab" data-id="log"><span>🧾</span>السجل</button>
  <button data-act="tab" data-id="report"><span>📊</span>التقرير</button>
  <button data-act="tab" data-id="settings"><span>⚙️</span>الإعدادات</button>
</nav>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================== أدوات ================== */
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const KIND={income:'الدخل',fixed:'المصاريف الثابتة',variable:'المصاريف المتغيرة',saving:'الادخار'};
const KICON={income:'💵',fixed:'📌',variable:'🛍',saving:'🏦'};
const toAr=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function fmt(n){
  n=Math.round((+n||0)*1000)/1000;
  const neg=n<0; let [i,f]=Math.abs(n).toFixed(3).split('.');
  f=f.replace(/0+$/,''); i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  let s=toAr(i+(f?'.'+f:'')).replace(/,/g,'٬').replace('.','٫');
  return (neg?'−':'')+s;
}
const money=n=>`<span class="m" dir="ltr">${fmt(n)}</span>`;
const moneyU=n=>`${money(n)}<span class="cur">ر.ع</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(s){
  s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،,]/g,'.').replace(/[^0-9.]/g,'');
  const p=s.split('.'); if(p.length>2) s=p[0]+'.'+p.slice(1).join('');
  const v=parseFloat(s); return isNaN(v)?0:v;
}
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDay=d=>toAr(d.getDate())+' '+MN[d.getMonth()];
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

/* ================== الحالة ================== */
const cfg=window.APP_CONFIG||{};
let sb=null;
const S={user:null,startDay:23,templates:[],months:[],monthKey:null,items:[],txs:[],tab:'home',logFilter:'all'};
const uid=()=>S.user.id;

function period(key,startDay=S.startDay){
  const [y,m]=key.split('-').map(Number);
  return {start:new Date(y,m-1,startDay),end:new Date(y,m,startDay-1)};
}
function currentKey(){
  const d=new Date(), sd=S.startDay;
  let y=d.getFullYear(), m=d.getMonth()+1;
  if(d.getDate()<sd){m--; if(m===0){m=12;y--;}}
  return `${y}-${pad(m)}`;
}
function monthTitle(key){
  const p=period(key);
  return {t:`شهر ${MN[p.start.getMonth()]} ${toAr(p.start.getFullYear())}`,s:`${fmtDay(p.start)} – ${fmtDay(p.end)}`};
}
const monthRow=key=>S.months.find(m=>m.month_key===key);
function allKeys(){
  const set=new Set(S.months.map(m=>m.month_key)); set.add(currentKey());
  return [...set].sort().reverse();
}
function periodOf(key){ // يستخدم تواريخ الشهر المخزنة إن وُجدت
  const r=monthRow(key);
  if(r) return {start:parseISO(r.start_date),end:parseISO(r.end_date)};
  return period(key);
}

/* ================== الحساب ================== */
function calc(){
  const it=S.items, sum=a=>a.reduce((x,y)=>x+Number(y.amount||0),0);
  const by=k=>it.filter(i=>i.kind===k);
  const inc=by('income'),fx=by('fixed'),sv=by('saving'),vr=by('variable');
  const paidSum=a=>a.filter(i=>i.paid).reduce((x,y)=>x+Number(y.paid_amount??y.amount),0);
  const unpaidSum=a=>a.filter(i=>!i.paid).reduce((x,y)=>x+Number(y.amount),0);
  const spentBy={};
  S.txs.forEach(t=>{spentBy[t.month_item_id]=(spentBy[t.month_item_id]||0)+Number(t.amount)});
  const c={spentBy,income:sum(inc),fixedTotal:sum(fx),fixedPaid:paidSum(fx),fixedUnpaid:unpaidSum(fx),
    saveTotal:sum(sv),savePaid:paidSum(sv),saveUnpaid:unpaidSum(sv),varBudget:sum(vr)};
  c.varSpent=vr.reduce((a,i)=>a+(spentBy[i.id]||0),0);
  c.varLeft=c.varBudget-c.varSpent;
  c.balance=c.income-c.fixedPaid-c.savePaid-c.varSpent;
  c.free=c.balance-c.fixedUnpaid-c.saveUnpaid;
  c.unallocated=c.income-c.fixedTotal-c.saveTotal-c.varBudget;
  c.fxCount=fx.length;c.fxPaidCount=fx.filter(i=>i.paid).length;
  c.svCount=sv.length;c.svPaidCount=sv.filter(i=>i.paid).length;
  return c;
}

/* ================== البيانات ================== */
async function chk(res){ if(res.error) throw res.error; return res.data; }
async function loadAll(){
  const [s,t,m]=await Promise.all([
    sb.from('settings').select('*').maybeSingle(),
    sb.from('budget_items').select('*').order('sort').order('created_at'),
    sb.from('months').select('*').order('month_key',{ascending:false})
  ]);
  const st=await chk(s); S.startDay=st?.start_day||23;
  S.templates=await chk(t); S.months=await chk(m);
  if(!S.monthKey||!allKeys().includes(S.monthKey)){
    const ck=currentKey();
    S.monthKey=ck;
  }
}
async function loadMonth(){
  if(!S.monthKey||!monthRow(S.monthKey)){S.items=[];S.txs=[];return;}
  const [i,t]=await Promise.all([
    sb.from('month_items').select('*').eq('month_key',S.monthKey).order('sort').order('created_at'),
    sb.from('transactions').select('*').eq('month_key',S.monthKey).order('spent_on',{ascending:false}).order('created_at',{ascending:false})
  ]);
  S.items=await chk(i); S.txs=await chk(t);
}
async function refresh(){ await loadMonth(); render(); }
async function reloadAll(){ await loadAll(); await loadMonth(); render(); }

async function startMonth(key){
  const p=period(key);
  await chk(await sb.from('months').upsert({user_id:uid(),month_key:key,start_date:isoDate(p.start),end_date:isoDate(p.end)}));
  const rows=S.templates.filter(t=>t.active&&(!t.end_month||key<=t.end_month)).map((t,i)=>({
    user_id:uid(),month_key:key,template_id:t.id,name:t.name,kind:t.kind,amount:t.amount,icon:t.icon||'',sort:t.sort??i}));
  if(rows.length) await chk(await sb.from('month_items').insert(rows));
  S.monthKey=key;
  await reloadAll();
  toast('تم بدء الشهر ✓');
}

/* ================== واجهة عامة ================== */
let toastT;
function toast(msg,err){
  const t=$('#toast'); t.textContent=msg; t.className='show'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2600);
}
const errMsg=e=>e?.message||'حدث خطأ، حاول مرة أخرى';
function openSheet(html){
  closeSheet();
  const o=document.createElement('div'); o.className='ov'; o.id='ov';
  o.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeSheet()});
  document.body.appendChild(o);
  requestAnimationFrame(()=>o.classList.add('show'));
  return o;
}
function closeSheet(){ const o=$('#ov'); if(o) o.remove(); }
async function guard(btn,fn){
  if(btn.disabled) return; btn.disabled=true;
  try{ await fn(); }catch(e){ toast(errMsg(e),true); btn.disabled=false; }
}

/* ================== العرض ================== */
function show(id,on){ $(id).classList.toggle('hidden',!on); }
function render(){
  const loggedIn=!!S.user;
  show('#auth',!loggedIn); show('#hd',loggedIn); show('#main',loggedIn); show('#tb',loggedIn);
  show('#fab',loggedIn&&S.tab==='home'&&!!monthRow(S.monthKey)&&S.items.some(i=>i.kind==='variable'));
  if(!loggedIn) return;
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.id===S.tab));
  renderHeader();
  const m=$('#main');
  m.innerHTML=({home:renderHome,log:renderLog,report:renderReport,settings:renderSettings})[S.tab]();
}
function renderHeader(){
  const keys=allKeys(), i=keys.indexOf(S.monthKey), mt=monthTitle(S.monthKey);
  $('#hd').innerHTML=`
    <button class="nv" data-act="prevMonth" ${i>=keys.length-1?'disabled':''} aria-label="أقدم">›</button>
    <div class="t"><b>${mt.t}</b><small>${mt.s}</small></div>
    <button class="nv" data-act="nextMonth" ${i<=0?'disabled':''} aria-label="أحدث">‹</button>`;
}

function noMonthView(){
  if(!S.templates.length){
    return `<div class="card empty"><b>جهّز ميزانيتك أول مرة</b>
      أضف راتبك ومصاريفك الثابتة والمتغيرة مرة واحدة، وبعدها كل شهر يبدأ بضغطة زر.
      <div class="btns">
        <button class="btn primary" data-act="seed">استخدم الأرقام التي اتفقنا عليها</button>
        <button class="btn" data-act="tab" data-id="settings">أضيف بنودي بنفسي</button>
      </div></div>`;
  }
  const mt=monthTitle(S.monthKey);
  return `<div class="card empty"><b>${mt.t} لم يبدأ بعد</b>${mt.s}
    <div class="btns"><button class="btn primary" data-act="startMonth">ابدأ هذا الشهر</button></div></div>`;
}

function fixedRow(i,savingMode){
  const lbl=i.paid?(savingMode?'تم التحويل':'تم الدفع'):(savingMode?'لم يُحوَّل':'لم يُدفع');
  return `<div class="row ${i.paid?'done':''}">
    <button class="chk ${i.paid?'on':''}" data-act="togglePaid" data-id="${i.id}" aria-label="تبديل">${i.paid?'✓':''}</button>
    <div class="rn" data-act="editItem" data-id="${i.id}"><span>${esc(i.icon)} ${esc(i.name)}</span><small>${lbl}</small></div>
    <div class="ra">${moneyU(i.amount)}</div></div>`;
}

function renderHome(){
  if(!monthRow(S.monthKey)) return noMonthView();
  const c=calc(), p=periodOf(S.monthKey);
  const today=new Date(); today.setHours(0,0,0,0);
  let daily='';
  if(S.monthKey===currentKey()){
    const days=Math.max(1,Math.round((p.end-today)/864e5)+1);
    if(c.varLeft>0) daily=`متاح للصرف يومياً ≈ ${moneyU(c.varLeft/days)} (${toAr(days)} يوم متبقي)`;
  }
  const by=k=>S.items.filter(i=>i.kind===k);
  const inc=by('income'),fx=by('fixed'),sv=by('saving'),vr=by('variable');
  let h=`<div class="card hero">
    <div class="lb">المتبقي من الراتب</div>
    <div class="big ${c.balance<0?'neg':''}">${money(c.balance)}</div>
    <div class="sub">بعد الالتزامات القادمة: ${moneyU(c.free)}</div>
    ${daily?`<div class="sub" style="margin-top:4px">${daily}</div>`:''}
    <div class="stats">
      <div><b>${money(c.varLeft)}</b>متبقي المتغير</div>
      <div><b>${toAr(c.fxPaidCount)}/${toAr(c.fxCount)}</b>ثوابت مدفوعة</div>
      <div><b>${money(c.savePaid)}</b>تم ادخاره</div>
    </div></div>`;
  if(c.unallocated<-0.0005) h+=`<div class="warnbox" style="margin:0 0 12px">⚠️ المخصصات تتجاوز الدخل بمقدار ${moneyU(-c.unallocated)}</div>`;

  // المتغيرة
  h+=`<div class="card"><h3>🛍 المصاريف المتغيرة <small>${moneyU(c.varSpent)} من ${moneyU(c.varBudget)}</small></h3>`;
  if(!vr.length) h+=`<div class="empty">لا توجد بنود متغيرة</div>`;
  vr.forEach(i=>{
    const sp=c.spentBy[i.id]||0, left=Number(i.amount)-sp, pct=Number(i.amount)>0?sp/Number(i.amount):(sp>0?2:0);
    h+=`<div class="vc"><div class="bd" data-act="addExpense" data-id="${i.id}">
      <div class="top"><span class="nm">${esc(i.icon)} ${esc(i.name)}</span><span class="left ${left<0?'neg':''}">${money(left)}</span></div>
      <div class="bar"><i class="${pct>1?'bad':pct>.8?'warn':''}" style="width:${Math.min(100,pct*100)}%"></i></div>

      <button class="ed" data-act="editItem" data-id="${i.id}" aria-label="تعديل">✎</button></div>`;
  });
  h+=`</div>`;

  // الثوابت
  h+=`<div class="card"><h3>📌 المصاريف الثابتة <small>${toAr(c.fxPaidCount)}/${toAr(c.fxCount)} · المتبقي ${moneyU(c.fixedUnpaid)}</small></h3>`;
  h+=fx.length?fx.map(i=>fixedRow(i)).join(''):`<div class="empty">لا توجد بنود ثابتة</div>`;
  h+=`</div>`;

  // الادخار
  if(sv.length){
    h+=`<div class="card"><h3>🏦 الادخار <small>${moneyU(c.savePaid)} من ${moneyU(c.saveTotal)}</small></h3>${sv.map(i=>fixedRow(i,true)).join('')}</div>`;
  }
  // الدخل
  h+=`<div class="card"><h3>💵 الدخل <small>${moneyU(c.income)}</small></h3>`;
  h+=inc.map(i=>`<div class="row"><div class="rn" data-act="editItem" data-id="${i.id}"><span>${esc(i.icon)} ${esc(i.name)}</span><small>اضغط للتعديل</small></div><div class="ra">${moneyU(i.amount)}</div></div>`).join('')||`<div class="empty">لا يوجد دخل</div>`;
  h+=`</div>`;
  h+=`<button class="btn" data-act="newItem">＋ إضافة بند لهذا الشهر فقط</button>`;
  return h;
}

function addExpense(preId){
  const vars=S.items.filter(i=>i.kind==='variable');
  if(!vars.length) return toast('لا توجد بنود متغيرة',true);
  let last=null; try{last=localStorage.getItem('lastCat')}catch(e){}
  let sel=(preId&&vars.find(v=>v.id===preId)?.id)||(vars.find(v=>v.id===last)?.id)||vars[0].id;
  const o=openSheet(`<h3>تسجيل مصروف</h3>
    <input id="amt" class="bigin" type="text" inputmode="decimal" placeholder="٠" autocomplete="off">
    <div class="chips">${vars.map(v=>`<button class="chip ${v.id===sel?'on':''}" data-cat="${v.id}">${esc(v.icon)} ${esc(v.name)}</button>`).join('')}</div>
    <label class="field"><span>ملاحظة (اختياري)</span><input id="note" type="text"></label>
    <div class="btns"><button class="btn primary" id="save">حفظ</button></div>`);
  o.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel=b.dataset.cat;o.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  const amt=$('#amt',o); setTimeout(()=>amt.focus(),60);
  const save=$('#save',o);
  const go=()=>guard(save,async()=>{
    const v=parseNum(amt.value); if(v<=0){toast('اكتب المبلغ',true);save.disabled=false;return;}
    await chk(await sb.from('transactions').insert({user_id:uid(),month_key:S.monthKey,month_item_id:sel,amount:v,note:$('#note',o).value.trim(),spent_on:isoDate(new Date())}));
    try{localStorage.setItem('lastCat',sel)}catch(e){}
    closeSheet(); await loadMonth(); render();

    toast(`تم ✓ — المتبقي في ${it.name}: ${fmt(left)} ر.ع`);

/* ================== التصدير ================== */
async function shareFile(name,blob){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

  add('المصاريف المتغيرة'); add('البند','المخصص','صُرف','المتبقي'); by('variable').forEach(i=>{const s=c.spentBy[i.id]||0;add(i.name,i.amount,s,Number(i.amount)-s)}); add();
  add('سجل المصروفات'); add('التاريخ','البند','المبلغ','ملاحظة'); S.txs.forEach(t=>add(t.spent_on,map[t.month_item_id]?.name||'',t.amount,t.note));
  return '﻿'+R.join('\r\n');
}
function printReport(){
  let f=$('#pf'); if(f) f.remove();
  f=document.createElement('iframe'); f.id='pf'; f.style.cssText='position:fixed;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){toast('الطباعة غير متاحة — استخدم ملف HTML',true)}};
  f.srcdoc=reportDoc();
}

/* ================== الأحداث ================== */
const acts={
  tab:(id)=>{S.tab=id;render();window.scrollTo(0,0)},
  prevMonth:async()=>{const k=allKeys(),i=k.indexOf(S.monthKey);if(i<k.length-1){S.monthKey=k[i+1];await refresh();}},
  nextMonth:async()=>{const k=allKeys(),i=k.indexOf(S.monthKey);if(i>0){S.monthKey=k[i-1];await refresh();}},
  startMonth:()=>startMonth(S.monthKey),
  seed:()=>seed(),
  togglePaid:async(id)=>{
    const it=S.items.find(i=>i.id===id); if(!it)return; const paid=!it.paid;
    it.paid=paid; it.paid_amount=paid?it.amount:null; render();   // تحديث فوري
    try{await chk(await sb.from('month_items').update({paid,paid_amount:paid?it.amount:null,paid_at:paid?new Date().toISOString():null}).eq('id',id));}
    catch(e){toast(errMsg(e),true);await refresh();}
  },
  addExpense:(id)=>addExpense(id),
  editItem:(id)=>{const it=S.items.find(i=>i.id===id);if(it)itemSheet(it)},
  newItem:()=>newItemSheet(),
  delTx:async(id)=>{ if(!confirm('حذف هذا المصروف؟'))return; await chk(await sb.from('transactions').delete().eq('id',id)); await refresh(); toast('تم الحذف'); },
  logFilter:(id)=>{S.logFilter=id;render()},
  editTpl:(id)=>tplSheet(S.templates.find(t=>t.id===id)),
  newTpl:(id)=>tplSheet(null,id),
  logout:async()=>{ if(confirm('تسجيل الخروج؟')) await sb.auth.signOut(); },
  exportPDF:()=>printReport(),
  exportCSV:()=>shareFile(`ميزانية-${S.monthKey}.csv`,new Blob([csvText()],{type:'text/csv;charset=utf-8'})),
  exportHTML:()=>shareFile(`تقرير-${S.monthKey}.html`,new Blob([reportDoc()],{type:'text/html;charset=utf-8'}))
};
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.closest('#ov')) return;
  const f=acts[t.dataset.act]; if(!f) return;
  try{await f(t.dataset.id,t);}catch(err){toast(errMsg(err),true);}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='startDay'){
    try{
      await chk(await sb.from('settings').upsert({user_id:uid(),start_day:+e.target.value}));
      S.startDay=+e.target.value; toast('تم الحفظ — يسري على الأشهر الجديدة'); render();
    }catch(err){toast(errMsg(err),true);}
  }
});
window.addEventListener('online',()=>show('#offline',false));
window.addEventListener('offline',()=>show('#offline',true));

/* ================== الدخول ================== */
function renderAuth(msg){
  $('#auth').innerHTML=`<h1>ميزانيتي</h1><p>سجّل دخولك لمتابعة ميزانيتك</p>
    <label class="field"><span>البريد الإلكتروني</span><input id="em" type="email" autocomplete="email" dir="ltr"></label>
    <label class="field"><span>كلمة المرور</span><input id="pw" type="password" autocomplete="current-password" dir="ltr"></label>
    <div class="btns"><button class="btn primary" id="li">دخول</button><button class="btn" id="su">إنشاء حساب جديد</button></div>
    ${msg?`<div class="warnbox">${esc(msg)}</div>`:''}`;
  const run=(mode)=>async function(){
    const email=$('#em').value.trim(), password=$('#pw').value;
    if(!email||password.length<6) return toast('اكتب البريد وكلمة مرور (٦ أحرف على الأقل)',true);
    this.disabled=true;
    try{
      if(mode==='in'){ await chk(await sb.auth.signInWithPassword({email,password})); }
      else{ const r=await sb.auth.signUp({email,password}); if(r.error) throw r.error;
        if(!r.data.session) renderAuth('تم إنشاء الحساب. إن كان تأكيد البريد مفعّلاً في سبابيس فأكّد بريدك ثم ادخل، أو عطّل Confirm email من الإعدادات.'); }
    }catch(e){ toast(e.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة':errMsg(e),true); this.disabled=false; }
  };
  $('#li').onclick=run('in'); $('#su').onclick=run('up');
}

async function boot(){
  if(!S.user){ S.items=[];S.txs=[];S.templates=[];S.months=[];render();renderAuth();return; }
  try{ await loadAll(); await loadMonth(); }
  catch(e){ toast(errMsg(e),true); }
  render();
}

(async function init(){
  if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.startsWith('YOUR_')){
    show('#auth',true);
    $('#auth').innerHTML=`<h1>ميزانيتي</h1><div class="warnbox">افتح ملف config.js وضع رابط Supabase والمفتاح العام (anon key) ثم أعد تحميل الصفحة.</div>`;
    return;
  }
  sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null;
  sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null; if((u?.id||null)!==(S.user?.id||null)){S.user=u; boot();}});
  if(!navigator.onLine) show('#offline',true);
  await boot();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
